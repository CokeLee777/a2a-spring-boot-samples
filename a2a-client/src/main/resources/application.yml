server:
  port: 8080

app:
  chat:
    provider: ${APP_CHAT_PROVIDER:google-genai}

spring:
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: ${GOOGLE_GENAI_MODEL:gemini-2.5-flash-lite}
            temperature: 0.7

a2a:
  order-agent-url: http://localhost:8081
  delivery-agent-url: http://localhost:8082
  client:
    timeout-seconds: 15
